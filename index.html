<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Таск трекер</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main>
    <h1>Трекер задач</h1>
    <form class="form">
      <label for="text" class="visually-hidden">Описание задачи</label>
      <input type="text" placeholder="Что нужно сделать?" id="text" />

      <button type="submit">Отправить</button>
    </form>

    <p class="error" hidden></p>

    <div class="tasks-header">
      <span>Задачи</span>
      <span class="tasks-counter"></span>
    </div>

    <ul class="tasks"></ul>
  </main>
  <script src="app.js"></script>
</body>
</html>
